<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mission Control</title>
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237c5cff'/><path d='M8 22l5-12 3 7 3-4 5 9' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32"><path d="M6 23l6-14 4 8 4-5 6 11" /></svg>
      </div>
      <div>
        <h1>Mission Control</h1>
        <p class="sub" id="host-line">Connexion…</p>
      </div>
    </div>
    <div class="topbar-right">
      <span class="live" id="live"><span class="pulse"></span><span id="live-text">Connexion…</span></span>
      <span class="clock" id="clock"></span>
    </div>
  </header>

  <main class="wrap">
    <section class="stats" id="stats" aria-label="Ressources du serveur"></section>

    <div class="layout">
      <section class="projects-col" aria-label="Projets">
        <div class="section-head">
          <h2>Projets <span class="count" id="project-count"></span></h2>
          <div class="toolbar">
            <input id="search" type="search" placeholder="Rechercher…" autocomplete="off">
            <div class="seg" id="filter" role="tablist">
              <button data-filter="all" class="on">Tous</button>
              <button data-filter="up">En ligne</button>
              <button data-filter="issues">Problèmes</button>
            </div>
            <label class="toggle"><input type="checkbox" id="show-system"> Infra</label>
          </div>
        </div>
        <div class="projects" id="projects"></div>
      </section>

      <aside class="side">
        <section class="panel">
          <div class="panel-head"><h3>Activité</h3><span class="muted small">événements Docker</span></div>
          <ol class="feed" id="feed"></ol>
        </section>
        <section class="panel">
          <div class="panel-head"><h3>Raccourcis</h3></div>
          <div class="links" id="shortcuts"></div>
        </section>
      </aside>
    </div>
  </main>

  <dialog id="logs" class="logs">
    <header>
      <div>
        <h3 id="logs-title">Logs</h3>
        <p class="muted small" id="logs-sub"></p>
      </div>
      <div class="logs-actions">
        <input id="logs-filter" type="search" placeholder="Filtrer…">
        <label class="toggle"><input type="checkbox" id="logs-follow" checked> Suivre</label>
        <button class="btn" id="logs-refresh" title="Rafraîchir">↻</button>
        <button class="btn" id="logs-close" title="Fermer">✕</button>
      </div>
    </header>
    <pre id="logs-body"></pre>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
